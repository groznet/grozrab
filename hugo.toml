baseURL = "https://grozrab.ru/"
languageCode = "ru-ru"
title = "GrozRab"
theme = "grozrab"
enableRobotsTXT = true
defaultContentLanguage = "ru"
hasCJKLanguage = false
summaryLength = 70
canonifyURLs = true
pluralizeListTitles = false

buildDrafts = false
buildFuture = false
buildExpired = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "monokai"

[pagination]
  pagerSize = 10

##############################################
# Site parameters
##############################################
[params]
  siteName = "GrozRab"
  siteDescription = "Старейшая газета грозненский рабочий"
  author = "Муса Мурадов"
  copyright = "© 2026 GrozRab"
  defaultImage = "/images/og-default.jpg"
  dateFormat = "02 Jan 2006"

  email = "info@grozrab.ru"
  phone = "8 (928) 123-45-67"
  address = "ул. Примерная, д. 123, г. Грозный, Чеченская Республика"

  [[params.social]]
    name = "Instagram"
    icon = "instagram"
    url = "https://www.instagram.com/grozrab"

  [[params.social]]
    name = "VK"
    icon = "vk"
    url = "https://vk.com/grozrab"

  [[params.social]]
    name = "Telegram"
    icon = "telegram"
    url = "https://t.me/nacsovet.ru"

  [params.theme]
    layout = "default"
    colorScheme = "light"
    logo = "/images/logo.png"
    favicon = "/favicon.ico"

  [params.sections]
    showHero = true
    showFeatures = true
    showBlog = true
    showTestimonials = false
    showCTA = true

  [params.newsletter]
    enable = false

##############################################
# Taxonomies
##############################################
[taxonomies]
  category = "categories"
  tag = "tags"
  author = "authors"
  location = "locations"

##############################################
# Outputs
##############################################
[outputs]
  home = ["HTML", "RSS"]

##############################################
# Sitemap
##############################################
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    respectDoNotTrack = true

  [privacy.youtube]
    privacyEnhanced = true

##############################################
# Deployment (GitHub Pages)
##############################################
[deployment]
  [[deployment.targets]]
    name = "production"
    URL = "https://grozrab.ru/"

##############################################
# Services
##############################################
[services]
  [services.googleAnalytics]
    id = "G-XXXXXXXXXX"

##############################################
# Languages
##############################################
[languages]
  [languages.ru]
    languageName = "Русский"
    weight = 1
    title = "GrozRab"

  [languages.en]
    languageName = "English"
    weight = 2
    title = "GrozRab"

##############################################
# Minify
##############################################
[minify]
  disableXML = true
  tdewolff = { html = { keepWhitespace = false } }

[permalinks]
  news = "/news/:year/:month/:slug/"

[urls]
  # Converts Cyrillic titles to safe ASCII slugs automatically
  hasCJKLanguage = false

# Ensure URL paths sanitize dots and special characters
removePathAccents = true